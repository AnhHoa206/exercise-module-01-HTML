<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <h2>CAR PURCHASING FORM</h2>
    <form action="" method="get">
        <label for="name">Name</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="Email">Email</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="Phone">Phone</label>
        <input type="tel" id="phone" name="phone"><br><br>
        <label for="choose a car">Car Model</label>
        <select id="car" name="car">
            <option selected value="model 1">model 1</option>
            <option value="model 2">model 2</option>
            <option value="model 3">model 3</option>
        </select><br><br>
        <label for="choose a color">Color</label>
        <select id="color" name="color">
            <option selected value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="black">Black</option>
        </select><br><br>
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1"><br><br>
        <label for="delivery">Delivery Option</label>
        <input type="date" id="pickup" name="delivery" value="pickup" checked><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
